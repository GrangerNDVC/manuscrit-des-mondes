<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Manuscrit des Mondes — Monde 1 : Victor Hugo</title>
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/vn.css">
<link rel="stylesheet" href="/css/minigames.css">
<style>
  /* ============================================================
     Positionnement du 3e portrait (centre) — cohérent avec les
     règles RÉELLES de vn.css (fournies par Julie).
     ------------------------------------------------------------
     IMPORTANT : ne surtout PAS utiliser `transform` ici pour le
     centrage horizontal. vn.css anime déjà `transform` sur
     .vn-portrait / .vn-portrait.visible (glissement translateY à
     l'apparition) ; une règle `transform: translateX(-50%)` sur ce
     sélecteur serait écrasée par cette règle plus spécifique et
     perdrait le centrage dès que le portrait devient visible. Le
     centrage se fait donc uniquement via left + largeur fixe +
     marge négative, qui n'entrent jamais en conflit avec `transform`.

     Largeur (26vw) et hauteur (65%, un peu moins que les 75% des
     portraits latéraux pour suggérer une position légèrement en
     retrait) choisies de façon empirique — à ajuster si besoin une
     fois vu en conditions réelles.
     ============================================================ */
  .portrait-center {
    left: 50%;
    width: 26vw;
    margin-left: -13vw;
    height: 65%;
  }
</style>
</head>
<body>

  <!-- Bouton retour au hub, toujours visible -->
  <button id="btn-back-to-hub" class="btn-skip" style="left:var(--space-lg); right:auto; z-index: 50;">◀ Bibliothèque</button>

  <!-- ============ ÉCRAN : VISUAL NOVEL ============ -->
  <section id="screen-vn" class="screen active">
    <div class="vn-background">
      <img id="vn-bg-image" src="" alt="">
    </div>

    <div class="vn-portraits">
      <img id="vn-portrait-left"   class="vn-portrait portrait-left"   src="" alt="">
      <img id="vn-portrait-center" class="vn-portrait portrait-center" src="" alt="">
      <img id="vn-portrait-right"  class="vn-portrait portrait-right"  src="" alt="">
    </div>

    <div id="vn-dialogue-box" class="vn-dialogue-box">
      <div id="vn-speaker-name" class="vn-speaker-name"></div>
      <div id="vn-text" class="vn-text"></div>
      <button id="vn-next-btn" class="vn-next-indicator" aria-label="Continuer">▶</button>
    </div>

    <!-- Zone de choix / QCM -->
    <div id="vn-choices" class="vn-choices hidden"></div>

    <!-- Zone "texte à trous" (exercice d'évaluation formative) -->
    <div id="vn-fill-blank" class="vn-fill-blank hidden">
      <p id="vn-fill-text"></p>
      <button id="vn-fill-validate" class="btn-primary">Valider</button>
    </div>
  </section>

  <!-- ============ ÉCRAN : MINI-JEU ============ -->
  <section id="screen-minigame" class="screen">
    <div class="minigame-header">
      <span id="minigame-title"></span>
      <span id="minigame-objective"></span>
    </div>
    <canvas id="minigame-canvas"></canvas>
    <div id="minigame-ui" class="minigame-ui"></div>
  </section>

  <!-- ============ OVERLAY : TRANSITION ============ -->
  <div id="transition-overlay" class="transition-overlay"></div>

  <!-- ============ SCRIPTS ============ -->
  <!-- Cœur, commun à tous les mondes -->
  <script src="/js/core/gameState.js"></script>
  <script src="/js/vn/chromaKeyFilter.js"></script>
  <script src="/js/vn/vnEngine.js"></script>
  <script src="/js/vn/vnParser.js"></script>
  <script src="/js/core/sceneManager.js"></script>

  <!-- Mini-jeux propres au Monde 1 (Hugo) uniquement -->
  <script src="/js/minigames/mg-shared.js"></script>
  <script src="/js/minigames/mg-ponctuation.js"></script>
  <script src="/js/minigames/mg-ordre-mots.js"></script>
  <script src="/js/minigames/mg-subordonnees.js"></script>
  <script src="/js/minigames/mg-coherence-paragraphe.js"></script>
  <script src="/js/minigames/mg-selection-info.js"></script>
  <script src="/js/minigames/mg-construction-recit.js"></script>

  <!-- Démarrage de CE monde -->
  <script>
    document.getElementById("btn-back-to-hub").addEventListener("click", () => {
      SceneManager.goToHub();
    });

    document.addEventListener("DOMContentLoaded", () => {
      try {
        SceneManager.startWorld("hugo");
      } catch (err) {
        console.error("Erreur au démarrage du Monde 1 (Hugo) :", err);
      }
    });
  </script>
</body>
</html>
